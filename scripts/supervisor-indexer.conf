# Supervisor config — Mytory Docs Index Watcher
# 
# Installation:
#   1. Install supervisor:  apt install supervisor (Linux) / brew install supervisor (macOS)
#   2. Copy this file:      cp scripts/supervisor-indexer.conf /etc/supervisor/conf.d/mytory-docs-indexer.conf
#   3. Update paths below to match your installation
#   4. Reload:              supervisorctl reread && supervisorctl update
#   5. Check status:        supervisorctl status mytory-docs-indexer
#   6. View logs:           supervisorctl tail mytory-docs-indexer
#
# Dependencies:
#   macOS: brew install fswatch
#   Linux: apt install inotify-tools

[program:mytory-docs-indexer]
command=/Users/mytory/workspace/mytory-docs/scripts/index-watch.sh
directory=/Users/mytory/workspace/mytory-docs
user=mytory
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=10
stdout_logfile=/Users/mytory/workspace/mytory-docs/scripts/.index-watch.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/Users/mytory/workspace/mytory-docs/scripts/.index-watch-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
environment=PATH="/usr/local/bin:/usr/bin:/bin"
